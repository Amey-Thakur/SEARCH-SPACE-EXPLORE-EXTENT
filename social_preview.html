<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Search Space | Explore Extent - Social Preview</title>
<!-- Renders the 1280x640 social preview from this repository's own assets. -->
</head>
<body>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;font-family:"Comic Sans MS","Segoe UI",system-ui,sans-serif}
.card{position:relative;width:1280px;height:640px;overflow:hidden;background:#000}
.nav{height:88px;background:#000;display:flex;align-items:center;padding:0 46px;border-bottom:3px solid #263dd4}
.brand{font-size:31px;font-weight:700;color:#fff}
.brand i{color:#263dd4;font-style:normal}
.links{margin-left:auto;display:flex;gap:38px;font-size:16px;font-weight:700;letter-spacing:.08em;color:#fff}
.links .on{color:#263dd4}
.hero{position:relative;height:404px;background:url(Source%20Code/img/showcase.jpg) center 34%/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.42) 46%,rgba(0,0,0,.20) 100%)}
.copy{position:absolute;left:46px;top:52px;z-index:2;width:640px}
.k{font-size:14px;font-weight:700;letter-spacing:.20em;color:#8fa4ff;font-family:"Segoe UI",sans-serif}
.h1{margin-top:14px;font-size:58px;font-weight:700;line-height:1.08;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.7)}
.sub{margin-top:16px;font-size:19px;color:#dfe6ff;line-height:1.6}
.strip{height:145px;background:#000;display:flex;align-items:center;padding:0 46px;gap:26px}
.milky{font-size:26px;font-weight:700;color:#fff}
.mail{margin-left:auto;display:flex;align-items:stretch}
.mail .box{width:270px;background:#fff;color:#8a8a8a;font-size:16px;padding:13px 15px;font-family:"Segoe UI",sans-serif}
.mail .go{background:#263dd4;color:#fff;font-size:16px;padding:13px 24px;font-family:"Segoe UI",sans-serif}
.by{margin-top:9px;font-family:"Segoe UI",sans-serif;font-size:16px;font-weight:700;color:#cfd6e6}

</style>
<div class="card">
  <div class="nav">
    <div class="brand">Search <i>Space</i> | <i>Explore</i> Extent</div>
    <div class="links"><span class="on">HOME</span><span>GALAXY</span><span>ABOUT</span></div>
  </div>
  <div class="hero">
    <div class="copy">
      <div class="k">PROJECT &middot; MY FIRST WEB DESIGN &middot; CSL504</div>
      <div class="h1">Explore<br>The Universe</div>
      <div class="sub">Galaxies are concentrations of stars, gas, dust, and dark matter.</div>
    </div>
  </div>
  <div class="strip">
    <div><div class="milky">Travel The Milky Way</div><div class="by">Amey Thakur &nbsp;&middot;&nbsp; HTML &amp; CSS &nbsp;&middot;&nbsp; 2021</div></div>
    <div class="mail"><div class="box">Best Email</div><div class="go">Dive In</div></div>
  </div>
</div>
</body>
</html>
